name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: panicmic_super
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, json, fileinfo
          coverage: none
          tools: none

      - name: Cache dev tool phars
        uses: actions/cache@v4
        with:
          path: tools
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Download phars
        run: make tools

      - name: Write test .env
        run: |
          cat > .env <<EOF
          APP_ENV=test
          APP_BASE_PATH=
          SESSION_NAME=panicmic_sid
          SESSION_SECRET=ci-session-secret
          CSRF_SECRET=ci-csrf-secret
          TRUST_PROXY=false
          ALLOWED_HOSTS=test.local,localhost,127.0.0.1
          SUPER_DB_HOST=127.0.0.1
          SUPER_DB_PORT=3306
          SUPER_DB_USER=root
          SUPER_DB_PASSWORD=root
          SUPER_DB_NAME=panicmic_super
          TENANT_DB_HOST=127.0.0.1
          TENANT_DB_PORT=3306
          TENANT_DB_USER=root
          TENANT_DB_PASSWORD=root
          TENANT_DB_PREFIX=panicmic_
          EOF

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && break
            sleep 1
          done

      - name: make check
        run: make check

      # Migration integrity. Every tenant migration must apply cleanly to a
      # fresh schema, and the ledger must be consistent afterwards.
      #
      # Migration 014 shipped in code that depended on it but was never
      # applied to the three live tenant databases, which took down every
      # realtime write in the app. This step proves the files are runnable;
      # `make migrate-check` on the deploy host proves they were actually run.
      - name: Migration integrity (fresh schema applies cleanly)
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot \
            -e "DROP DATABASE IF EXISTS panicmic_ci_migrate; CREATE DATABASE panicmic_ci_migrate;"

          # Super scope first: the tenants table must exist before we can
          # register the scratch tenant against it.
          php scripts/migrate.php super

          mysql -h 127.0.0.1 -uroot -proot panicmic_super -e \
            "INSERT INTO tenants (slug, venue_name, night_name, database_name)
             VALUES ('citest', 'CI Venue', 'CI Night', 'panicmic_ci_migrate')
             ON DUPLICATE KEY UPDATE database_name = VALUES(database_name);"

          php scripts/migrate.php tenant panicmic_ci_migrate

          # Applying twice must be a no-op — catches a migration that isn't
          # recorded in the ledger and would re-run on every deploy.
          php scripts/migrate.php tenant panicmic_ci_migrate | tee /tmp/second-run.txt
          grep -q 'Up to date' /tmp/second-run.txt

          # Nothing may be left pending anywhere.
          php scripts/migrate.php check

      - name: Clean up migration test schema
        if: always()
        run: |
          mysql -h 127.0.0.1 -uroot -proot \
            -e "DELETE FROM panicmic_super.tenants WHERE slug='citest';
                DROP DATABASE IF EXISTS panicmic_ci_migrate;" || true

  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, json, fileinfo
          coverage: none
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Write browser-test .env
        run: |
          cat > .env <<EOF
          APP_ENV=test
          SESSION_NAME=panicmic_sid
          CSRF_SECRET=browser-test-csrf-secret
          TRUST_PROXY=false
          SUPER_DB_HOST=127.0.0.1
          SUPER_DB_PORT=3306
          SUPER_DB_USER=root
          SUPER_DB_PASSWORD=root
          SUPER_DB_NAME=panicmic_test_super
          TENANT_DB_HOST=127.0.0.1
          TENANT_DB_PORT=3306
          TENANT_DB_USER=root
          TENANT_DB_PASSWORD=root
          TENANT_DB_PREFIX=panicmic_
          EOF
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:browser
